[package]
name = "rewind"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Instant-replay recorder for Windows, written in Rust on top of libobs"
build = "build.rs"

[dependencies]
rewind-core = { path = "../core" }
libobs-wrapper = "10"
libobs-simple = "9"
libobs-bootstrapper = "0.5"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
global-hotkey = "0.10"
trash = "5"
opener = { version = "0.9", features = ["reveal"] }
log = "0.4"
tray-icon = "0.26"
tokio = { version = "1", features = ["rt", "macros"] }
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
libloading = "0.9"
wasapi = "0.27"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_ProcessStatus",
    "Win32_Networking_WinHttp",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell"]

[build-dependencies]
libobs-bootstrapper = "0.5"
winresource = "0.1"
