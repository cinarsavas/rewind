name: Release

# Push a tag like v1.0.0 to publish a release. Run it manually to get a test build without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  REWIND_REPO: ${{ github.repository }}

jobs:
  windows:
    name: Installer and portable build
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-dev" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - run: cargo test -p rewind-core
      - run: cargo build --release -p rewind

      - name: Stage the app and bundle the OBS runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\stage | Out-Null
          Copy-Item target\release\rewind.exe dist\stage\Rewind.exe
          # Download and verify the official OBS runtime once, here, so users never have to.
          $p = Start-Process -FilePath "dist\stage\Rewind.exe" -ArgumentList "--install-runtime" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "OBS runtime provisioning failed (exit $($p.ExitCode))" }
          if (-not (Test-Path dist\stage\obs.dll)) { throw "obs.dll missing after provisioning" }
          Remove-Item -Recurse -Force dist\stage\.libobs-bootstrap-cache -ErrorAction SilentlyContinue
          Copy-Item LICENSE, README.md, THIRD_PARTY_NOTICES.md dist\stage\
          Get-ChildItem dist\stage | Measure-Object -Property Length -Sum | ForEach-Object { "Staged $([math]::Round($_.Sum/1MB)) MB in the root folder" }

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\stage\* -DestinationPath "dist\Rewind-portable-x64.zip" -CompressionLevel Optimal

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/DMyRepoUrl=https://github.com/${{ github.repository }}" installer\rewind.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/Rewind-Setup-*.exe
            dist/Rewind-portable-x64.zip

  packs:
    name: Optional add-on packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build voice and theme packs
        run: python3 scripts/build_packs.py --repo "${{ github.repository }}" --tag "${{ github.ref_name }}" --out dist/packs
      - uses: actions/upload-artifact@v4
        with:
          name: packs
          path: dist/packs/*

  publish:
    name: Publish
    needs: [windows, packs]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          cd assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            assets/Rewind-Setup-*.exe
            assets/Rewind-portable-x64.zip
      - name: Release notes
        run: |
          python3 - <<'PY'
          import re, pathlib, os
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^## \[?{re.escape(tag)}\]?.*?$(.*?)(?=^## |\Z)", text, re.S | re.M)
          body = (m.group(1).strip() if m else "See the changelog.")
          footer = """

          ---
          **Which file do I want?**
          - `Rewind-Setup-*.exe` is the installer (recommended). No admin rights needed.
          - `Rewind-portable-x64.zip` runs from any folder.
          - `voice-*`, `theme-*` and `packs.toml` are optional add-ons the app downloads on demand; you don't need to download them yourself.
          - `SHA256SUMS.txt` lists checksums. See `docs/ANTIVIRUS.md` if your antivirus complains.
          """
          pathlib.Path("release-notes.md").write_text(body + footer, encoding="utf-8")
          PY
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: assets/*
          fail_on_unmatched_files: true
