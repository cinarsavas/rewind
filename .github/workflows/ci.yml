name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rewind-core
      - name: Pack builder syntax
        run: python3 -m py_compile scripts/build_packs.py

  windows:
    name: Build and lint (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p rewind --release
      - run: cargo build --release -p rewind
      - uses: actions/upload-artifact@v4
        with:
          name: Rewind-exe-no-runtime
          path: target/release/rewind.exe
          retention-days: 7
